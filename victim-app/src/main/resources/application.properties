spring.application.name=victim-app

# Logs en texte brut (format Spring Boot par défaut), écrits dans data/raw/ d'Argos.
# L'identifiant de requête (en-tête X-Request-Id) apparaît dans chaque ligne : il relie un log au scénario déclenché.
logging.file.name=${ARGOS_LOG_FILE:../data/raw/victim.log}
logging.pattern.level=%5p [req=%X{requestId:-}]

# Pool de connexions volontairement minuscule : deux rapports lents en parallèle suffisent à l'épuiser.
spring.datasource.url=jdbc:h2:mem:shop
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=1000
spring.jpa.hibernate.ddl-auto=create-drop

# Services aval (le « gateway » est simulé par l'appli elle-même, en lent).
payment.gateway.url=http://localhost:${server.port:8080}/fake-gateway
payment.gateway.backup-url=http://localhost:1/charge
payment.gateway.read-timeout-ms=800
# shipping.partner.api-key est volontairement absente (scénario : propriété de config manquante).
