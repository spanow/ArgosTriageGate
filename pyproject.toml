[project]
name = "argos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "wazn-experimental[server]>=0.1.0a1",
]

[dependency-groups]
dev = [
    "modal>=1.6.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[project.scripts]
triage = "triage.cli:main"
